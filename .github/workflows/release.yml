name: Release the Swift package

# On demand only. The Swift package's release is a tag on the commit that holds its xcframework. Before tagging, the
# job checks that each slice is the version being released and was built from the SDK commit being released, so a tag
# can't point at an earlier build. A dry run, the default, checks and doesn't tag.
#
# The push trigger only registers the workflow, so it can be dispatched on a branch before it reaches master. Its job
# runs on dispatch alone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, which each slice must declare (CFBundleShortVersionString)
        required: true
      sdk_commit:
        description: The TheoremReach-iOS-SDK commit the release was built from (its full SHA)
        required: true
      dry_run:
        description: Dry run (check, don't tag)
        type: boolean
        default: true
  push:
    paths:
      - .github/workflows/release.yml

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Check the xcframework and tag (dry run unless unticked)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the version tag
    env:
      VERSION: ${{ inputs.version }}
      SDK_COMMIT: ${{ inputs.sdk_commit }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the xcframework against the release
        run: |
          python3 - << 'EOF'
          import glob, os, plistlib, sys
          version, commit = os.environ['VERSION'], os.environ['SDK_COMMIT']
          slices = sorted(glob.glob('TheoremReachSDK.xcframework/*/TheoremReachSDK.framework/Info.plist'))
          release_build = len(slices) == 2
          for path in slices:
              with open(path, 'rb') as plist:
                  info = plistlib.load(plist)
              built_version, built_from = info.get('CFBundleShortVersionString'), info.get('TR_SOURCE_COMMIT', '')
              print(f'{path}: {built_version}, built from {built_from or "an unrecorded commit"}')
              release_build = release_build and built_version == version and built_from == commit
          sys.exit(0 if release_build else f'The xcframework is not the {version} build from {commit}')
          EOF
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::The tag $VERSION exists already"
            exit 1
          fi

      - name: Tag the commit
        if: inputs.dry_run == false
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
